# dsh-controller bundle patch.
#
# 它只贡献一行，且不依赖任何特定 composition：
#
#   controller  Host 插件：注册 `dsh_*` 工具，用来控制 DSH 自身。
#               需要 `tools` 服务；DSH 的其余服务（agents / sessions /
#               sessionController / pluginManager / …）都是**可选**的，
#               运行期逐个探测：有就走 API，没有就退回桌面自动化并在结果里说明。
#
# `name` 是**模块说明符**，不是展示名：它按「DSH 安装目录 → profile 目录」
# 两个锚点解析，所以必须写成装进 profile 的那个包名 `dsh-controller`。
#
# 配置分四类：
#   - api:  API 路径的偏好（是否允许在 API 可用时仍然强制走 UI；等待空闲的超时）
#   - create: 新建会话走哪条路（默认 GUI 优先、失败退 API）以及那条路用到的坐标
#   - ui:   桌面自动化回退（PowerShell 超时、截图目录、DSH 窗口标题匹配）
#   - guard: 危险动作的门槛（创建会话 / 安装插件是否必须显式确认）

- insert:
    - id: controller
      name: 'dsh-controller'
      config:
        # 总开关。false = 不注册任何工具（插件仍在树里，但模型看不到 dsh_*）。
        enabled: true

        api:
          # 允许在 API 可用时强制走桌面自动化（排查 API 路径时用）。null = 不允许，
          # 也就是每个动作都优先 API —— create 是唯一例外，见下面 create.via。
          forceUi: false
          # `dsh_sessions {action:"wait"}` 的默认等待上限（毫秒）。
          defaultWaitMs: 120000
          # 动作级超时（毫秒）：一次调用超过它就带着一条可读的错误收口，而不是永远挂着
          # （超时不等于取消，底下那件事可能还在跑）。故意慢的动作各自声明更大的上限：
          # wait = defaultWaitMs + 10s、create = clickTimeoutMs + waitMs + 30s、
          # install/remove = 900s、host restart = 180s、host resume = 120s。
          actionTimeoutMs: 30000

        create:
          # auto = 先点真实窗口的「新会话」，失败整条退回 API（默认）；
          # gui  = 只走 GUI，失败就报错，绝不偷偷用 API；
          # api  = 完全不碰窗口，旧行为。
          via: auto
          # 「新会话」按钮中心在窗口里的位置（宽高比例）。实测 1296x828 窗口上是 (150, 112)。
          newSessionX: 0.116
          newSessionY: 0.135
          # 新会话的输入框与发送按钮位置（宽高比例，实测 (790, 468) 与 (1119, 484)）。
          # 会话内的输入框在窗口里低得多（约 86%/93%），那是另一套坐标。
          composerX: 0.61
          composerY: 0.565
          # 点击后给界面切换的时间，以及等待新会话出现在列表里的上限（毫秒）。
          settleMs: 1200
          waitMs: 15000
          # 单次 GUI 动作（点击）的超时（毫秒）。
          clickTimeoutMs: 45000
          # 第一条消息是否也在 GUI 里敲进去。默认 false：实测这台机器上 DSH 的输入框只吃
          # SendKeys 的 ASCII，中文既进不去（Unicode SendInput 无声失败）又清不掉（旧草稿会
          # 被接在后面），所以消息默认交给 API 投递。打开它时脚本会在有草稿或非 ASCII 时拒绝。
          submitInGui: false

        # 重启编排：停止所有在跑的会话 → 落盘计划 → 起进程外看门狗 → **请应用自己退出**（点它
        # 托盘菜单里的「退出」）→ 退不掉才由看门狗收进程树并重新拉起 → 按落盘的计划继续它们。计划是跨进程的（<DSH home>/controller/restart-plan.json），
        # 所以「重启前」和「重启后」是两个进程在读同一份文件；恢复只会在「换了进程」时发生。
        #
        # 两个 pid 分工（实测，不是推测）：`ctx.appExit` 关的是 **Host 子进程**，桌面壳不会跟着退
        # ——它会留下一个没有后端的窗口，也就是「重连中」那一屏。所以计划里同时记 shellPid 与
        # hostPid：看门狗等 Host 走完，再请壳关窗，宽限期内不走就强杀，最后才拉起 exe。
        restart:
          enabled: true
          # 请求关停前的延迟（秒）：本次工具结果要先送达调用方，所以关停不能是立即的。
          delaySeconds: 6
          # 延时脚本等「整棵树走干净」的上限（秒）；到点还没干净就放弃，绝不启动第二个实例。
          waitSeconds: 120
          # 给应用优雅退出留的宽限（秒）：实测关掉主窗口后它可能既不退也不报错，
          # 所以到点就收掉整棵树（同名进程全属同一个应用实例），再拉起 exe。
          # **开启 gracefulQuit 时看门狗实际拿到的宽限是「这个值 + gracefulQuitBudgetMs」**：
          # 不加起来，它会在托盘点击落地之前就把进程树收掉。
          killAfterSeconds: 10
          # 优雅退出那一腿：右键应用自己的托盘图标、点菜单里的「退出」，也就是用户手工做的那件事。
          # 它由 dsh-computer-use 的托盘能力完成（只看像素，不依赖无障碍接口）；找不到那个插件、
          # 或者找不到图标/菜单项时**自动退回强杀**，重启不会因此失败。关掉它就是老行为。
          gracefulQuit: true
          # 这一腿的总预算（毫秒）：找图标 + 读菜单 + 点中一项。实测折叠区四个图标约 20–30 秒；
          # 它同时也是看门狗多等的秒数，所以给得太大只会让「优雅失败」的兜底来得更晚。
          gracefulQuitBudgetMs: 60000
          # 要点的菜单项文字（按「包含」匹配，忽略大小写与 CJK 之间的空格）。英文界面改成 "Quit"。
          gracefulQuitItem: 退出
          # 识别菜单与 tooltip 的语言；菜单文字是匹配依据，所以要和界面语言一致。
          gracefulQuitLanguage: zh-Hans-CN
          # 托盘那一腿留下的前后对照截图放哪；null = 兄弟插件自己的 <插件>/tmp/tray。
          gracefulQuitScratchDir: null
          # 整棵树干净之后再等多久才拉起（毫秒），让会话日志写完。
          settleMs: 1500
          # 一次最多自动继续多少条会话。
          maxResume: 20
          # 计划的有效期（秒）：超过它就不再恢复。
          planTtlSeconds: 900
          # 重启后投给每条会话的正文。
          resumeText: 继续上次未完成的工作。
          # 中止会话时是否保留排队/引导消息。
          keepInbox: false
          # 启动后多久开始检查恢复计划（毫秒），以及最多等宿主把服务装配好多久。
          resumeDelayMs: 4000
          resumeWaitMs: 180000

        ui:
          # DSH 桌面窗口的标题匹配（大小写不敏感的子串）。null = 用进程名匹配。
          windowTitle: null
          # 截图落地目录。null = <插件目录>/tmp/screens
          screenshotDir: null
          # 单个 PowerShell 动作的超时（毫秒）。
          scriptTimeoutMs: 60000
          # 注入按键前的等待，给窗口前台化留时间（毫秒）。
          focusSettleMs: 120

        guard:
          # true = `dsh_sessions {action:"create"}` 必须带 confirm:true 才真的建会话。
          requireConfirmForCreate: false
          # true = `dsh_plugins {action:"install"|"uninstall"|"enable"|"disable"}` 必须带 confirm:true。
          requireConfirmForPlugins: true
          # true = `dsh_host {action:"restart"}` 必须带 confirm:true。默认打开：重启会中止所有
          # 正在跑的对话并退出整个应用，这是本插件里最重的动作。
          requireConfirmForRestart: true
